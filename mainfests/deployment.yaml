apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-app111
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmops-app111
  template:
    metadata:
      labels:
        app: llmops-app111
    spec:
      containers:
      - name: llmops-app111
        image: dataguru97/studybuddy:v17
        ports:
        - containerPort: 8501
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq-api-secret
              key: GROQ_API_KEY






